name: CI / Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Package & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Code Formatting (Ruff)
        run: ruff format --check src tests scripts

      - name: Lint Codebase (Ruff)
        run: ruff check src tests scripts

      - name: Static Type Checking (MyPy)
        run: mypy src tests scripts

  security-and-secrets:
    name: Security & Secret Scan Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan for Exposed Secrets
        run: python scripts/ci/secret_scan.py

      - name: Check for Prohibited Sensitive Files
        run: python scripts/ci/check_sensitive_files.py

  test-suite:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite with Coverage Gate (>=80%)
        run: pytest --cov=src/missing_data_platform --cov-report=term-missing --cov-fail-under=80

  reproducibility-smoke-test:
    name: Reproducibility & Pipeline Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Deterministic Reproducibility Smoke Test
        run: python scripts/ci/reproducibility_smoke_test.py

  quality-gate:
    name: Quality Gate Summary
    needs:
      - code-quality
      - security-and-secrets
      - test-suite
      - reproducibility-smoke-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate All Quality Gates
        run: |
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.security-and-secrets.result }}" != "success" ] || \
             [ "${{ needs.test-suite.result }}" != "success" ] || \
             [ "${{ needs.reproducibility-smoke-test.result }}" != "success" ]; then
            echo "❌ CI Quality Gates Failed. All required checks must pass before merging."
            exit 1
          fi
          echo "✅ All CI Quality Gates Passed Successfully!"
